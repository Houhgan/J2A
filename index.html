<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }

  video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
  }

  #tap-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    cursor: pointer;
    z-index: 10;
    transition: opacity 0.5s ease;
  }

  #tap-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .play-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #F6C300;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 2s infinite;
  }

  .play-btn svg {
    width: 32px;
    height: 32px;
    fill: #000;
    margin-left: 5px;
  }

  #tap-overlay p {
    color: #fff;
    font-size: 1rem;
    letter-spacing: 0.1em;
    opacity: 0.7;
    text-transform: uppercase;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(246,195,0,0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 16px rgba(246,195,0,0); }
  }
</style>
</head>
<body>

<video id="vid" playsinline preload="auto">
  <source src="video.mp4" type="video/mp4">
</video>

<div id="tap-overlay">
  <div class="play-btn">
    <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
  </div>
  <p>Go !</p>
</div>

<script>
  const vid = document.getElementById("vid");
  const overlay = document.getElementById("tap-overlay");

  vid.play().then(() => {
    overlay.classList.add("hidden");
  }).catch(() => {});

  overlay.addEventListener("click", () => {
    vid.play();
    overlay.classList.add("hidden");
  });
</script>
</body>
</html>
